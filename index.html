<style>
  .hero {

  .eyebrow {

    color: #d9b66d;

  }

  }

    margin-bottom: 2rem;
  }

  .hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.9rem 1.5rem;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 700;
    transition: 0.25s ease;
  }

  .btn-primary {
    background: #d9b66d;
    color: #1a120d;
  }

  .btn-primary:hover {
    background: #f0c777;
  }

  }

  .image-card-small {
    height: 390px;
  }

      padding-top: 3rem;
      padding-bottom: 3rem;
